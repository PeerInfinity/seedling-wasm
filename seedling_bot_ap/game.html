<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>seedling_bot_ap</title>
<!-- swf_bridge_game_page.html — the packaged __swfBridge game page template.
     deploy_wasm_avm2.sh instantiates it as game.html next to the wasm
     (replacing seedling_bot_ap / 480 / 480), producing a
     SELF-CONTAINED dir (game.html + <name>.js/.wasm + swf_bridge_avm2.js)
     that a host app loads as a SAME-ORIGIN iframe src.

     Host contract (e.g. Archipelago-CC's flash-ap-api / flashPanel layer,
     via iframe.contentWindow — same-origin):
       __swfBridge.game.<cb>(arg)     game callbacks (BridgeGeneric:
                                      wireCheck/configure/readState) — appear
                                      after the game's AS3 addCallback runs;
                                      poll for them after start
       __swfBridge.queueItems(items)  enqueue BridgeGeneric queue items
       __swfBridge.onStateChanged     override to receive state reports
       __swfBridgeStart()             start the game (must be called from a
                                      USER-GESTURE handler inside this iframe
                                      — WebGPU/audio init consume the
                                      activation; the visible Start button
                                      does exactly this for manual play)
       window.__runtimeReady          true once the wasm runtime loaded -->
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; max-width: 100%; max-height: 100%; }
  #btn-start {
    position: absolute; font: bold 20px sans-serif; padding: 14px 38px;
    cursor: pointer; border-radius: 8px; border: 2px solid #6c6;
    background: #131; color: #cfc;
  }
  #btn-start:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<canvas id="canvas" width="480" height="480"></canvas>
<button id="btn-start" disabled>▶ Start</button>

<!-- The production AVM2 EI shim — installs window.__swfBridge (the runtime's
     ExternalInterface availability gate + the BridgeGeneric host surface).
     Classic script, before the wasm glue. -->
<script src="swf_bridge_avm2.js"></script>

<script>
  window.__runtimeReady = false;
  var started = false;
  window.Module = {
    locateFile: function (p) { return p; },
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    onRuntimeInitialized: function () {
      window.__runtimeReady = true;
      document.getElementById('btn-start').disabled = false;
    },
  };
  // Start the game. MUST run within a user-gesture handler in this document
  // (WebGPU renderer init + AudioContext consume the activation).
  window.__swfBridgeStart = function () {
    if (started || !window.__runtimeReady) return false;
    started = true;
    var b = document.getElementById('btn-start');
    b.style.display = 'none';
    Module.ccall('runSWF', null, [], [], { async: true });
    return true;
  };
  document.getElementById('btn-start').addEventListener('click', function () {
    window.__swfBridgeStart();
  });
  // Keyboard reaches the game via the canvas' emscripten listeners; give the
  // canvas focus once running so arrows/X/C work without an extra click.
  document.addEventListener('click', function () {
    var c = document.getElementById('canvas');
    if (c && started) c.focus();
  });
</script>
<script src="seedling_bot_ap.js"></script>
</body>
</html>
